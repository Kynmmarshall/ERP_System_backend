# Host Nginx site for the ERP on a single VPS.
#
# Everything is proxied to the Dockerised gateway on 127.0.0.1:2022, which is
# the only entry point into the compose network and already owns routing, rate
# limiting, auth_request and the security headers.
#
# This file is the PRE-TLS form: one plain HTTP server block. `certbot --nginx`
# rewrites it in place, adding the 443 server, the certificate paths and the
# 80 -> 443 redirect. Shipping the 443 block here instead would deadlock -
# nginx refuses to load a config pointing at certificates that do not exist
# yet, and certbot refuses to run while nginx is invalid.
#
# Install:
#   cp ops/nginx/erp.conf /etc/nginx/sites-available/erp.conf
#   ln -sf /etc/nginx/sites-available/erp.conf /etc/nginx/sites-enabled/erp.conf
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d ict-erp-system.duckdns.org
#
# Afterwards, add HSTS to the 443 block certbot generated - only the host
# knows TLS is real, so the gateway cannot set it:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
# Note on http2: this box runs nginx 1.24, where `http2 on;` does not exist
# and the option belongs on the listen line. It is omitted entirely because
# another site already fixes the protocol options for :443, and repeating
# them only produces "protocol options redefined" warnings.

server {
    listen 80;
    listen [::]:80;
    server_name ict-erp-system.duckdns.org;

    # Matches client_max_body_size in gateway/nginx.conf; a smaller value here
    # would reject uploads before the gateway ever saw them.
    client_max_body_size 10m;

    access_log /var/log/nginx/erp-access.log;
    error_log  /var/log/nginx/erp-error.log;

    location / {
        proxy_pass http://127.0.0.1:2022;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Hardcoded rather than $scheme: this hop is always plain HTTP, but
        # once certbot is done the only block serving traffic is the TLS one,
        # and the refresh cookie's Secure flag depends on this saying https.
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
