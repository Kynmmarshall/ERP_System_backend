# Host Nginx site for the ERP on a single VPS.
#
# TLS terminates here; everything is proxied to the Dockerised gateway on
# 127.0.0.1:2022, which is the only entry point into the compose network and
# already owns routing, rate limiting, auth_request and the security headers.
#
# Install:
#   cp ops/nginx/erp.conf /etc/nginx/sites-available/erp.conf
#   ln -sf /etc/nginx/sites-available/erp.conf /etc/nginx/sites-enabled/erp.conf
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# Run certbot AFTER the port-80 block below is live; it rewrites the ssl_*
# lines and the redirect itself.

server {
    listen 80;
    listen [::]:80;
    server_name ict-erp-system.duckdns.org;

    # Must stay on plain HTTP for certbot's HTTP-01 challenge and renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ict-erp-system.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/ict-erp-system.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ict-erp-system.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Set here rather than in the gateway: only the host knows TLS is real.
    # The gateway supplies the rest (CSP, Permissions-Policy, nosniff, ...)
    # and those pass through this proxy untouched.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Matches client_max_body_size in gateway/nginx.conf; a smaller value here
    # would reject uploads before the gateway ever saw them.
    client_max_body_size 10m;

    access_log /var/log/nginx/erp-access.log;
    error_log  /var/log/nginx/erp-error.log;

    location / {
        proxy_pass http://127.0.0.1:2022;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Hardcoded, not $scheme: this hop is plain HTTP, but the request did
        # arrive over TLS and the refresh cookie's Secure flag depends on it.
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
