worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    log_format main '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Never trust client-supplied identity/tenant headers; only the gateway sets them
    # once auth_request verification lands in Phase 2.
    proxy_set_header X-Tenant-Id "";
    proxy_set_header X-User-Id "";

    # Per-client-IP request budgets (tunable). Login has a tighter, separate budget.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api_login:10m rate=5r/m;
    limit_req_status 429;

    upstream frontend_upstream {
        server frontend:80;
    }

    upstream identity_upstream {
        server identity:8000;
    }

    upstream academic_upstream {
        server academic:8000;
    }

    upstream finance_upstream {
        server finance:8000;
    }

    upstream hr_upstream {
        server hr:8000;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 10m;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # TODO(phase 2): add `auth_request /internal/verify;` here once identity
        # exposes its session-verification endpoint, then forward the verified
        # X-Tenant-Id / X-User-Id / X-Roles headers set by that subrequest.

        location /api/v1/auth/ {
            limit_req zone=api_general burst=40 nodelay;
            proxy_pass http://identity_upstream/;
            include /etc/nginx/proxy_params.conf;
        }

        location = /api/v1/auth/login {
            limit_req zone=api_login burst=5 nodelay;
            proxy_pass http://identity_upstream/login;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/v1/academic/ {
            limit_req zone=api_general burst=40 nodelay;
            proxy_pass http://academic_upstream/;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/v1/finance/ {
            limit_req zone=api_general burst=40 nodelay;
            proxy_pass http://finance_upstream/;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/v1/hr/ {
            limit_req zone=api_general burst=40 nodelay;
            proxy_pass http://hr_upstream/;
            include /etc/nginx/proxy_params.conf;
        }

        location / {
            proxy_pass http://frontend_upstream;
            include /etc/nginx/proxy_params.conf;
        }
    }
}
