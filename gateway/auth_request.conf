# Included inside every protected location. Verifies the caller's JWT via
# identity's /internal/verify (an internal-only subrequest, never reachable
# directly from outside), then forwards the verified identity as headers -
# overriding the empty defaults set in nginx.conf so a client-supplied
# X-Tenant-Id etc. can never reach an upstream service.
auth_request /internal/verify;
auth_request_set $verified_user_id $upstream_http_x_user_id;
auth_request_set $verified_tenant_id $upstream_http_x_tenant_id;
auth_request_set $verified_campus_id $upstream_http_x_campus_id;
auth_request_set $verified_roles $upstream_http_x_roles;

proxy_set_header X-User-Id $verified_user_id;
proxy_set_header X-Tenant-Id $verified_tenant_id;
proxy_set_header X-Campus-Id $verified_campus_id;
proxy_set_header X-Roles $verified_roles;
