.7432 L1308.252,804.2432 L1341.5625,811.7432 L1341.5625,901.8311 A9.375,9.375 0 0 0 1350.9375,911.2061 L1910.8228,911.2061 A9.375,9.375 0 0 0 1920.1978,901.8311 L1920.1978,716.1182 L1901.4478,697.3682 L1350.9375,697.3682 A9.375,9.375 0 0 0 1341.5625,706.7432" fill="#FFF5DE" style="stroke:#C89139;stroke-width:0.9375;"/><path d="M1901.4478,697.3682 L1901.4478,711.4307 A4.6875,4.6875 0 0 0 1906.1353,716.1182 L1920.1978,716.1182 L1901.4478,697.3682" fill="#FFF5DE" style="stroke:#C89139;stroke-width:0.9375;"/><text fill="#584021" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="280.1495" x="1367.8125" y="748.9929">Measure before scaling:</text><text fill="#584021" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="429.0491" x="1375.1056" y="782.0105">- p95 latency and request throughput</text><text fill="#584021" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="501.9672" x="1375.1056" y="815.0281">- open DB connections / NullPool overhead</text><text fill="#584021" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="461.1053" x="1375.1056" y="848.0457">- lock contention and report query plans</text><text fill="#584021" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="487.4194" x="1375.1056" y="881.0632">- database storage and backup headroom</text></g><g class="entity" data-entity="GMN28" data-source-line="37" data-uid="ent0029" id="entity_GMN28"><path d="M2055.9375,723.6182 L2055.9375,885.6885 A9.375,9.375 0 0 0 2065.3125,895.0635 L2862.9987,895.0635 A9.375,9.375 0 0 0 2872.3737,885.6885 L2872.3737,732.9932 L2853.6237,714.2432 L2471.25,714.2432 L2463.75,630.4517 L2456.25,714.2432 L2065.3125,714.2432 A9.375,9.375 0 0 0 2055.9375,723.6182" fill="#FFF5DE" style="stroke:#C89139;stroke-width:0.9375;"/><path d="M2853.6237,714.2432 L2853.6237,728.3057 A4.6875,4.6875 0 0 0 2858.3112,732.9932 L2872.3737,732.9932 L2853.6237,714.2432" fill="#F