<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1440px" preserveAspectRatio="none" style="width:1916px;height:1440px;background:#FFFFFF;" version="1.1" viewBox="0 0 1916 1440" width="1916.25px" zoomAndPan="magnify"><title>Browser session | Observable state and retry policy</title><defs/><g><g class="title" data-source-line="2"><text fill="#15324F" font-family="sans-serif" font-size="43.125" font-weight="bold" lengthAdjust="spacing" textLength="1061.8689" x="420.1593" y="78.5175">Browser session | Observable state and retry policy</text></g><g id="Loading"><rect fill="#EEF5F7" height="130.5176" rx="9.375" ry="9.375" style="stroke:#007F86;stroke-width:0.9375;" width="152.1588" x="872.8125" y="352.3682"/><line style="stroke:#007F86;stroke-width:0.9375;" x1="872.8125" x2="1024.9713" y1="434.1357" y2="434.1357"/><text fill="#000000" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="84.6588" x="906.5625" y="403.9929">loading</text></g><g id="Guest"><rect fill="#EEF5F7" height="130.5176" rx="9.375" ry="9.375" style="stroke:#007F86;stroke-width:0.9375;" width="254.3262" x="313.125" y="644.8682"/><line style="stroke:#007F86;stroke-width:0.9375;" x1="313.125" x2="567.4512" y1="726.6357" y2="726.6357"/><text fill="#000000" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="186.8262" x="346.875" y="696.4929">unauthenticated</text></g><g id="Auth"><rect fill="#EEF5F7" height="163.5352" rx="9.375" ry="9.375" style="stroke:#007F86;stroke-width:0.9375;" width="360.7745" x="635.625" y="912.9932"/><line style="stroke:#007F86;stroke-width:0.9375;" x1="635.625" x2="996.3995" y1="1027.7783" y2="1027.7783"/><text fill="#000000" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="157.6282" x="669.375" y="964.6179">authenticated</text><text fill="#000000" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="293.2745" x="669.375" y="997.6355">principal in React context</text></g><g id="Refresh"><rect fill="#EEF5F7" height="163.5352" rx="9.375" ry="9.375" style="stroke:#007F86;stroke-width:0.9375;" width="521.2994" x="11.25" y="1255.1807"/><line style="stroke:#007F86;stroke-width:0.9375;" x1="11.25" x2="532.5494" y1="1369.9658" y2="1369.9658"/><text fill="#000000" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="267.0117" x="45" y="1306.8054">request refresh in flight</text><text fill="#000000" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="453.7994" x="45" y="1339.823">AuthContext may remain authenticated</text></g><ellipse cx="948.75" cy="164.8682" fill="#222222" rx="18.75" ry="18.75" style="stroke:#222222;stroke-width:1.875;"/><g class="entity" data-entity="GMN2" data-source-line="17" data-uid="ent0003" id="entity_GMN2"><path d="M1058.4375,337.3682 L1058.4375,410.4932 L1024.9512,417.9932 L1058.4375,425.4932 L1058.4375,499.4385 A9.375,9.375 0 0 0 1067.8125,508.8135 L1594.1418,508.8135 A9.375,9.375 0 0 0 1603.5168,499.4385 L1603.5168,346.7432 L1584.7668,327.9932 L1067.8125,327.9932 A9.375,9.375 0 0 0 1058.4375,337.3682" fill="#FFF5DE" style="stroke:#C89139;stroke-width:0.9375;"/><path d="M1584.7668,327.9932 L1584.7668,342.0557 A4.6875,4.6875 0 0 0 1589.4543,346.7432 L1603.5168,346.7432 L1584.7668,327.9932" fill="#FFF5DE" style="stroke:#C89139;stroke-width:0.9375;"/><text fill="#584021" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="475.7043" x="1084.6875" y="379.6179">Loading route: accessible status spinner.</text><text fill="#584021" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="433.3557" x="1084.6875" y="412.6355">Guest protected route: redirect /login,</text><text fill="#584021" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="342.8778" x="1084.6875" y="445.6531">remember original pathname.</text><text fill="#584021" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="379.3817" x="1084.6875" y="478.6707">Successful login navigates back.</text></g><g class="entity" data-entity="GMN5" data-source-line="23" data-uid="ent0006" id="entity_GMN5"><path d="M566.25,1256.1182 L566.25,1329.2432 L533.0255,1336.7432 L566.25,1344.2432 L566.25,1418.1885 A9.375,9.375 0 0 0 575.625,1427.5635 L1090.2393,1427.5635 A9.375,9.375 0 0 0 1099.6143,1418.1885 L1099.6143,1265.4932 L1080.8643,1246.7432 L575.625,1246.7432 A9.375,9.375 0 0 0 566.25,1256.1182" fill="#FFF5DE" style="stroke:#C89139;stroke-width:0.9375;"/><path d="M1080.8643,1246.7432 L1080.8643,1260.8057 A4.6875,4.6875 0 0 0 1085.5518,1265.4932 L1099.6143,1265.4932 L1080.8643,1246.7432" fill="#FFF5DE" style="stroke:#C89139;stroke-width:0.9375;"/><text fill="#584021" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="463.9893" x="592.5" y="1298.3679">One module-level Promise deduplicates</text><text fill="#584021" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="447.8906" x="592.5" y="1331.3855">refresh within one browser JS runtime.</text><text fill="#584021" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="386.662" x="592.5" y="1364.4031">No shared multi-tab coordination.</text><text fill="#584021" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="424.563" x="592.5" y="1397.4207">No scheduled proactive expiry timer.</text></g><g class="entity" data-entity="GMN8" data-source-line="29" data-uid="ent0009" id="entity_GMN8"><path d="M1133.4375,1256.1182 L1133.4375,1418.1885 A9.375,9.375 0 0 0 1142.8125,1427.5635 L1893.8434,1427.5635 A9.375,9.375 0 0 0 1903.2184,1418.1885 L1903.2184,1265.4932 L1884.4684,1246.7432 L1419.7071,1246.7432 L995.7315,1036.4916 L1404.7071,1246.7432 L1142.8125,1246.7432 A9.375,9.375 0 0 0 1133.4375,1256.1182" fill="#FFF5DE" style="stroke:#C89139;stroke-width:0.9375;"/><path d="M1884.4684,1246.7432 L1884.4684,1260.8057 A4.6875,4.6875 0 0 0 1889.1559,1265.4932 L1903.2184,1265.4932 L1884.4684,1246.7432" fill="#FFF5DE" style="stroke:#C89139;stroke-width:0.9375;"/><text fill="#584021" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="592.3425" x="1159.6875" y="1298.3679">Access JWT is not in localStorage/sessionStorage.</text><text fill="#584021" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="634.6399" x="1159.6875" y="1331.3855">HttpOnly refresh cookie survives reload for restoration.</text><text fill="#584021" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="700.4059" x="1159.6875" y="1364.4031">Query cache is separate and not cleared by auth transitions.</text><text fill="#584021" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="671.1438" x="1159.6875" y="1397.4207">Logout network-error path requires further UX verification.</text></g><g class="link" data-entity-1=".start." data-entity-2="Loading" data-uid="lnk3" id="link_.start._Loading"><polygon fill="#486579" points="948.75,351.939,956.25,335.064,948.75,342.564,941.25,335.064,948.75,351.939" style="stroke:#486579;stroke-width:1.875;"/><path d="M948.75,191.435 C948.75,226.5872 948.75,287.5728 948.75,340.689" fill="none" style="stroke:#486579;stroke-width:2.625;"/><text fill="#000000" font-family="sans-serif" font-size="26.25" lengthAdjust="spacing" textLength="140.0812" x="967.5" y="270.8679">App mounts</text></g><g class="link" data-entity-1="Loading" data-entity-2="Auth" data-uid="lnk4" id="link_Loading_Auth"><polygon fill="#486579" points="996.3172,955.1251,1014.7828,955.3262,1004.9252,951.411,1008.8403,941.5535,996.3172,955.1251" style="stroke:#486579;stroke-width:1.875;"/><path d="M1011.9652,483.7537 C1021.3046,492.2214 1031.0221,500.5398 1040.625,507.9932 C1063.0945,525.433 1081.1729,516.8868 1095,541.7432 C1167.9189,672.8265 1178.7713,754.815 1095,879.2432 C1